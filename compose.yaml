# Base de datos local para desarrollo: docker compose up -d
# Misma versión mayor que Neon (PostgreSQL 17).
services:
  postgres:
    image: postgres:17-alpine
    container_name: gerenzdent-db
    environment:
      POSTGRES_DB: gerenzdent
      POSTGRES_USER: gerenz
      POSTGRES_PASSWORD: gerenz_local   # solo desarrollo local
      TZ: America/Lima
    ports:
      # 5433 en la PC: el 5432 lo usa el PostgreSQL instalado en Windows
      - "5433:5432"
    volumes:
      - gerenzdent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerenz -d gerenzdent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gerenzdent-db-data:
