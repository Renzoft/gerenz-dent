name: warmup

# Despierta la API en Render antes de la notificación diaria de las 16:30 (ADR-003).
# 21:15 UTC = 16:15 en Lima (UTC-5, sin horario de verano).
on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # Se activa cuando exista la variable API_URL en Settings → Variables (después del despliegue)
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping a /actuator/health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "${{ vars.API_URL }}/actuator/health"; then exit 0; fi
            sleep 15
          done
          echo "La API no respondió" && exit 1
