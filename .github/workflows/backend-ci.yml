name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Formato + compilación + pruebas (Testcontainers usa el Docker del runner) + cobertura
      - name: Build y pruebas
        run: ./gradlew build --no-daemon

      - name: Reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reportes
          path: |
            backend/build/reports/tests/
            backend/build/reports/jacoco/
          retention-days: 7

      # Verifica que la imagen de producción (Render) compile
      - name: Build de la imagen Docker
        run: docker build -t gerenzdent-api:ci .
