# Configuración común. Los valores sensibles SIEMPRE vienen de variables de entorno en producción.
# Los valores por defecto apuntan a la BD local de compose.yaml (solo desarrollo).
spring:
  application:
    name: gerenzdent-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gerenzdent}
    username: ${DB_USER:gerenz}
    password: ${DB_PASSWORD:gerenz_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  zona-horaria: America/Lima
